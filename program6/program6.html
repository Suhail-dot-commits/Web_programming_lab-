<html>
<head>
<title> Program</title>
</head>
<body>
<script>

document.write("<h2>Math </h2>");
document.write("<h2>Properties</h2>");
document.writeln("<br> Math.E : "+Math.E);
document.writeln("<br> Math.PI : "+Math.PI);
document.writeln("<br> Math.SQRT2 : "+Math.SQRT2);
document.writeln("<br> Math.SQRT1_2 : "+Math.SQRT1_2);
document.writeln("<br> Math.LN2 : "+Math.LN2);
document.writeln("<br> Math.LN10 : "+Math.LN10);
document.writeln("<br> Math.LOG2E : "+Math.LOG2E);
document.writeln("<br> Math.LOG10E : "+Math.LOG10E);
document.write("<h2>Math Objects</h2>");
let n=7.52;
document.write("<b> Number : 7.52 </b><br><br>");
document.writeln("integer part : "+Math.trunc(n));
document.writeln("<br> nearest integer:"+Math.round(n));
document.writeln("<br> Square root:"+Math.sqrt(n));
document.writeln("<br> Minimum value from (4,3,7,-1):"+Math.min(4,3,7,-1));
document.writeln("<br> Maximum value from (4,3,7,-1):"+Math.min(4,3,7,-1));
document.write("<h2>String methods</h2>");
let str="Muhammed Mubarak";
document.write("<b> String : Muhammed mubarak </b><br><br>");
document.writeln("Lenght string : "+str.lenght);
document.writeln("<br> string Upper case : "+str.toUpperCase());
document.writeln("<br> string Lower case : "+str.toLowerCase());
document.writeln("<br> Jpint string  : "+str.concat("","A P"));
document.writeln("<br> replace muhammed in string : "+str.replace("Muhammed","Naham"));
</script>
</body>
</html>
