<html>
<head>
<title>User registration</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <form><h1>Registration Form</h1>
    <fieldset><legend>User data</legend><br>
      <label for="fname" id="name-label">Name:</label>

        <select id="title">
              <option>Mr</option>
              <option>Mrs</option>
              <option>Ms</option>
        </select>
<input type="text" id="fname" name="fname" required>
<br><br>
<label for="PHONE CLASS="C3">Phone
  <input type="tel" required><br><br></label>
<label for="email">Email
  <input type="mail" required><br><br></label></fieldset><br><br>
<label for="address" >Address</label>
  <textarea id="address" required></textarea><br><br>
<label>Gender :</label>
  <input type="radio" name="gender" required><label>male</label>
  <input type="radio" name="gender" required><label>Female</label>
  <input type="radio" name="gender" required><label>Other</label><br><br>
<label>Languages Known :</label>
  <input type="checkbox" name="Language"><label>English</label>
  <input type="checkbox" name="Language"><label>Malayalam</label>
  <input type="checkbox" name="Language"><label>Hindi</label><br><br>
<label>Course :</label>
  <select required>
    <option>Course</option>
    <option>MCA</option>
    <option>MBA</option>
    <option>B.Arch</option>
    <option>B.Tech AI/DS</option>
    <option>B.Tech CE</option>
    <option>B.Tech IT</option> 
    <option>B.Tech EEE</option>
  </select><br><br>
<div style="text-align: center;">
  <input type="submit" value="Submit">
  <input type="reset" value="Reset">
</div>
</form>
</body>

</html>
